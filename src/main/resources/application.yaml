spring:
  application:
    name: reschedu

  datasource:
    url: ${RESCHEDU_DB_URL:jdbc:postgresql://localhost:5432/reschedu}
    username: ${RESCHEDU_DB_USER}
    password: ${RESCHEDU_DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reschedu
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.academy.reschedu.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${RESCHEDU_MAIL_USERNAME}
    password: ${RESCHEDU_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    mail:
      enabled: false # 로컬 dev용 Gmail 자격증명 미설정 상태라 헬스체크 자체를 끔(기능에는 영향 없음)
  metrics:
    tags:
      application: ${spring.application.name}
