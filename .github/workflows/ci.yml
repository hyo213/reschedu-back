name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      # RescheduApplicationTests(전체 컨텍스트 로딩)는 로컬 환경변수로 지정한 실제 Postgres에
      # 의존해 여기서는 제외한다. domain.*는 Mockito 기반 단위 테스트, integration.*는
      # Testcontainers로 실제 Postgres/Redis/Kafka를 띄워 검증하는 통합 테스트다
      # (GitHub Actions ubuntu 러너는 Docker를 기본 지원하므로 별도 서비스 설정이 필요 없다).
      - name: Run tests
        run: ./gradlew test --tests "com.academy.reschedu.domain.*" --tests "com.academy.reschedu.integration.*" --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
