name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      # RescheduApplicationTests(전체 컨텍스트 로딩)는 실제 Postgres/Redis/Kafka가 필요해 제외한다.
      # 나머지는 Mockito 기반 순수 단위 테스트라 별도 인프라 없이 여기서 검증 가능하다.
      - name: Run unit tests
        run: ./gradlew test --tests "com.academy.reschedu.domain.*" --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
